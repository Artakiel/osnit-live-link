<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Accéder à la vidéo partagée sur TikTok.">
  <meta name="theme-color" content="#101114">
  <title>Voir la vidéo sur TikTok</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      color: #f4f4f5;
      background: #101114;
    }
    main {
      width: min(100%, 38rem);
      padding: clamp(1.5rem, 6vw, 3rem);
      border: 1px solid #33353b;
      border-radius: 1rem;
      background: #191a1f;
    }
    h1 { margin: 0 0 1rem; line-height: 1.15; }
    p { color: #c9cbd1; line-height: 1.65; }
    a.button {
      display: inline-block;
      margin-top: .75rem;
      padding: .8rem 1.1rem;
      border-radius: .65rem;
      color: #101114;
      background: #f4f4f5;
      font-weight: 700;
      text-decoration: none;
    }
    a.button:focus-visible { outline: 3px solid #8ab4ff; outline-offset: 3px; }
    footer { margin-top: 1.5rem; font-size: .875rem; color: #a4a6ae; }
  </style>
</head>
<body>
  <main>
    <h1>Voir la vidéo</h1>
    <p>Cette page vous redirige vers la vidéo hébergée sur TikTok. Sa disponibilité dépend des paramètres de visibilité et des conditions de TikTok.</p>
    <a class="button"
       href="https://vm.tiktok.com/ZN9fVnP7synST-fafai/"
       rel="noopener noreferrer">
      Ouvrir la vidéo sur TikTok
    </a>
    <footer>Page de partage sans lecteur intégré, publicité, traceur ni collecte de données ajoutée.</footer>
  </main>
</body>
</html>
